<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patricio Del Boca - {{ title or 'Information Systems Engineer' }}</title>
    <meta name="description" content="{{ description or default_description }}">
    <link rel="canonical" href="{{ canonical_url or site_url }}">
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Open Graph -->
    <meta property="og:site_name" content="pdelboca.me">
    <meta property="og:type" content="{{ og_type or 'website' }}">
    <meta property="og:title" content="{{ title or 'Patricio Del Boca' }}">
    <meta property="og:description" content="{{ description or default_description }}">
    <meta property="og:url" content="{{ canonical_url or site_url }}">
    <meta property="og:image" content="{{ og_image or default_og_image }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ og_image_alt or title or 'pdelboca.me' }}">
    <meta property="og:locale" content="en_US">
    {% if published_time %}
    <meta property="article:published_time" content="{{ published_time }}">
    {% endif %}

  </head>
  <body>
    <header>
      <nav>
        <a href="/">> <span>pdelboca</span></a>
        <a class="flex-push-right" href="/writings.html">writings</a>
        <a href="/projects.html">projects</a>
        <a href="/about.html">about</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>
      <p>© Patricio Del Boca 2016 - 2026</p>
      <ul>
        <li><a aria-label="Github" href="https://github.com/pdelboca" target="_blank">Github</a></li>
        <li><a aria-label="Bluesky" href="https://bsky.app/profile/pdelboca.me" target="_blank">Bluesky</a></li>
        <li><a aria-label="Linkedin" href="https://www.linkedin.com/in/patriciodelboca/" target="_blank">Linkedin</a></li>
        <li><a aria-label="Curriculum Vitae" href="/static/pdfs/cv.pdf">CV</a></li>
      </ul>
    </footer>
  </body>
</html>
